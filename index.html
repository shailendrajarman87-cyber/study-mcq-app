.card{

h2{

.secondary{

.option.wrong{

.feedback{

.success{

.error{

}

  overflow:auto;
  background:#f7f7f7;
  padding:12px;
  border-radius:10px;

}

footer{
  text-align:center;
  padding:25px;
  color:#777;
  font-size:13px;
}
</style>

<body>

<header>
  <h1>📚 Study MCQ App</h1>
  <p>Learn • Practice • Improve</p>
</header>

<div class="container">

<!-- HOME -->
<section id="home" class="card">
  <h2>🎯 Choose an Option</h2>

  <button onclick="showSection('generator')">
    🧠 Generate MCQs
  </button>

  <button onclick="showSection('pdfSection')">
    📄 Solve MCQ PDF
  </button>

  <button class="secondary" onclick="toggleDarkMode()">
    🌙 Dark Mode
  </button>
</section>


<!-- GENERATOR -->
<section id="generator" class="card hidden">

  <h2>🧠 Generate MCQs</h2>

  <label>📚 Select Subject</label>

  <select id="subject">
    <option value="pharmacology">Pharmacology</option>
    <option value="microbiology">Microbiology</option>
    <option value="pharmaceutics">Pharmaceutics</option>
    <option value="general">General Study</option>
  </select>

  <label>🔢 Number of Questions</label>

  <select id="questionCount">
    <option value="5">5 Questions</option>
    <option value="10" selected>10 Questions</option>
    <option value="20">20 Questions</option>
    <option value="50">50 Questions</option>
  </select>

  <button onclick="generateQuiz()">
    🚀 Start MCQ Quiz
  </button>

  <button class="secondary" onclick="showSection('home')">
    ⬅️ Back
  </button>

</section>


<!-- PDF -->
<section id="pdfSection" class="card hidden">

  <h2>📄 Solve MCQ PDF</h2>

  <p class="small">
    Upload a PDF containing MCQ questions. The app will try to read
    the text from the PDF.
  </p>

  <div class="fileBox">
    📁 Select PDF
    <input type="file" id="pdfFile" accept=".pdf">
  </div>

  <button onclick="readPDF()">
    📖 Read PDF
  </button>

  <div id="pdfStatus"></div>

  <div id="pdfText" class="hidden"></div>

  <button id="pdfQuizButton"
          class="hidden"
          onclick="startPDFQuiz()">
    🎯 Start PDF Quiz
  </button>

  <button class="secondary" onclick="showSection('home')">
    ⬅️ Back
  </button>

</section>


<!-- QUIZ -->
<section id="quiz" class="card hidden">

  <div id="questionNumber"></div>

  <div class="progress">
    <div id="progressBar" class="progress-bar"></div>
  </div>

  <h2 id="question"></h2>

  <div id="options"></div>

  <div id="feedback" class="feedback hidden"></div>

  <button id="nextButton"
          class="hidden"
          onclick="nextQuestion()">
    Next Question ➡️
  </button>

  <button class="secondary" onclick="showSection('home')">
    🏠 Home
  </button>

</section>


<!-- RESULT -->
<section id="result" class="card hidden">

  <h2>🏆 Quiz Completed!</h2>

  <div class="score" id="finalScore"></div>

  <div class="stat">
    <div>
      <b id="correctCount">0</b>
      <br>
      <span class="success">Correct</span>
    </div>

    <div>
      <b id="wrongCount">0</b>
      <br>
      <span class="error">Wrong</span>
    </div>
  </div>

  <div class="score" id="percentage"></div>

  <button onclick="restartQuiz()">
    🔄 Try Again
  </button>

  <button class="secondary" onclick="showSection('home')">
    🏠 Home
  </button>

</section>

</div>

<footer>
  📚 Study MCQ App • Practice Every Day
</footer>

/* =========================
   VARIABLES
========================= */

let quizQuestions=[];
let currentQuestion=0;
let score=0;
let answered=false;
let pdfQuestions=[];


/* =========================
   SECTION CONTROL
========================= */

function showSection(id){

  const sections=[
    "home",
    "generator",
    "pdfSection",
    "quiz",
    "result"
  ];

  sections.forEach(section=>{
    document.getElementById(section)
      .classList.add("hidden");
  });

  document.getElementById(id)
    .classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* =========================
   GENERATE QUIZ
========================= */

function generateQuiz(){

  const subject=
    document.getElementById("subject").value;

  const count=
    parseInt(
      document.getElementById("questionCount").value
    );

  let bank=questionBank[subject];

  quizQuestions=[];

  for(let i=0;i<count;i++){
    quizQuestions.push(
      bank[i % bank.length]
    );
  }

  startQuiz();
}


/* =========================
   START QUIZ
========================= */

function startQuiz(){

  currentQuestion=0;
  score=0;

  showSection("quiz");

  showQuestion();
}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

  answered=false;

  const q=
    quizQuestions[currentQuestion];

  document.getElementById("questionNumber")
    .innerText=
    "Question "+
    (currentQuestion+1)+
    " / "+
    quizQuestions.length;

  document.getElementById("question")
    .innerText=q.q;

  document.getElementById("feedback")
    .classList.add("hidden");

  document.getElementById("nextButton")
    .classList.add("hidden");

  const progress=
    ((currentQuestion)/
    quizQuestions.length)*100;

  document.getElementById("progressBar")
    .style.width=progress+"%";

  let html="";

  q.options.forEach((option,index)=>{

    html+=`
      <button
        class="option"
        onclick="checkAnswer(${index})">

        ${String.fromCharCode(65+index)}.
        ${option}

      </button>
    `;
  });

  document.getElementById("options")
    .innerHTML=html;
}


/* =========================
   CHECK ANSWER
========================= */

function checkAnswer(selected){

  if(answered) return;

  answered=true;

  const q=
    quizQuestions[currentQuestion];

  const buttons=
    document.querySelectorAll(".option");

  if(selected===q.answer){

    score++;

    buttons[selected]
      .classList.add("correct");

    document.getElementById("feedback")
      .innerHTML=
      "✅ <b>Correct!</b><br>"+
      q.explanation;

  }else{

    buttons[selected]
      .classList.add("wrong");

    buttons[q.answer]
      .classList.add("correct");

    document.getElementById("feedback")
      .innerHTML=
      "❌ <b>Wrong!</b><br>"+
      "Correct Answer: "+
      q.options[q.answer]+
      "<br><br>"+
      q.explanation;
  }

  document.getElementById("feedback")
    .classList.remove("hidden");

  document.getElementById("nextButton")
    .classList.remove("hidden");
}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

  currentQuestion++;

  if(currentQuestion<
     quizQuestions.length){

    showQuestion();

  }else{

    showResult();
  }
}


/* =========================
   RESULT
========================= */

function showResult(){

  showSection("result");

  const total=
    quizQuestions.length;

  const wrong=
    total-score;

  const percent=
    Math.round(
      (score/total)*100
    );

  document.getElementById("finalScore")
    .innerText=
    "Score: "+score+" / "+total;

  document.getElementById("correctCount")
    .innerText=score;

  document.getElementById("wrongCount")
    .innerText=wrong;

  document.getElementById("percentage")
    .innerText=
    percent+"%";

  document.getElementById("progressBar")
    .style.width="100%";
}


/* =========================
   RESTART
========================= */

function restartQuiz(){

  currentQuestion=0;
  score=0;

  showSection("quiz");

  showQuestion();
}


/* =========================
   PDF READER
========================= */

async function readPDF(){

  const file=
    document.getElementById("pdfFile")
    .files[0];

  const status=
    document.getElementById("pdfStatus");

  const textBox=
    document.getElementById("pdfText");

  const quizButton=
    document.getElementById("pdfQuizButton");

  if(!file){

    status.innerHTML=
      "<p class='error'>❌ Please select a PDF first.</p>";

    return;
  }

  status.innerHTML=
    "<p>⏳ Reading PDF...</p>";

  textBox.classList.add("hidden");

  try{

    const arrayBuffer=
      await file.arrayBuffer();

    const pdf=
      await pdfjsLib
      .getDocument({
        data:arrayBuffer
      })
      .promise;

    let fullText="";

    for(
      let pageNumber=1;
      pageNumber<=pdf.numPages;
      pageNumber++
    ){

      const page=
        await pdf.getPage(pageNumber);

      const content=
        await page.getTextContent();

      const pageText=
        content.items
        .map(item=>item.str)
        .join(" ");

      fullText+=
        pageText+
        "\n";
    }

    if(!fullText.trim()){

      status.innerHTML=
        "<p class='error'>❌ Text could not be extracted from this PDF.</p>";

      return;
    }

    textBox.innerText=
      fullText.substring(0,10000);

    textBox.classList.remove("hidden");

    status.innerHTML=
      "<p class='success'>✅ PDF read successfully!</p>";

    pdfQuestions=
      parseMCQs(fullText);

    if(pdfQuestions.length>0){

      quizButton.classList.remove("hidden");

      status.innerHTML+=
        "<p class='success'>🎯 "+
        pdfQuestions.length+
        " MCQs detected.</p>";

    }else{

      status.innerHTML+=
        "<p>⚠️ MCQ format was not detected automatically.</p>";
    }

  }catch(error){

    console.error(error);

    status.innerHTML=
      "<p class='error'>❌ Error reading PDF.</p>";
  }
}
