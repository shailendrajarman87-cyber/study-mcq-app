<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study MCQ App</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  color: #222;
}

header {
  background: #4f46e5;
  color: white;
  padding: 22px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 27px;
}

header p {
  margin: 7px 0 0;
}

.container {
  max-width: 700px;
  margin: 20px auto;
  padding: 15px;
}

.card {
  background: white;
  padding: 20px;
  margin-bottom: 18px;
  border-radius: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border: 0;
  border-radius: 10px;
  background: #4f46e5;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: .9;
}

.option {
  background: #eef2ff;
  color: #222;
  text-align: left;
}

.option.correct {
  background: #bbf7d0;
}

.option.wrong {
  background: #fecaca;
}

.hidden {
  display: none;
}

#feedback {
  font-weight: bold;
  margin-top: 15px;
}

.score {
  font-size: 22px;
  font-weight: bold;
  text-align: center;
}

input[type="file"] {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
}

textarea {
  width: 100%;
  min-height: 130px;
  padding: 12px;
  border-radius: 10px;
  border: 1px solid #ccc;
  margin-top: 10px;
}

.small {
  font-size: 13px;
  color: #666;
}
</style>
</head>

<header>
  <h1>📚 Study MCQ App</h1>
  <p>Learn • Practice • Improve</p>
</header>

<div class="container">

  <!-- HOME -->
  <div id="home" class="card">
    <h2>Choose an Option</h2>

    <button onclick="showGenerator()">
      🧠 Generate MCQs
    </button>

    <button onclick="showPDF()">
      📄 Solve MCQ PDF
    </button>
  </div>

  <!-- GENERATOR -->
  <div id="generator" class="card hidden">
    <h2>🧠 Generate MCQs</h2>

    <p>Enter a topic:</p>

    <input id="topic"
      type="text"
      placeholder="Example: Pharmacology"
      style="width:100%;padding:13px;border-radius:10px;border:1px solid #ccc;">

    <button onclick="generateMCQs()">
      Generate Questions
    </button>

    <div id="generated"></div>

    <button onclick="goHome()">
      ⬅ Back
    </button>
  </div>

  <!-- PDF -->
  <div id="pdfSection" class="card hidden">
    <h2>📄 Solve MCQ PDF</h2>

    <p>Select your MCQ PDF:</p>

    <input type="file" id="pdfFile" accept=".pdf">

    <p class="small">
      PDF should contain MCQs with options such as A, B, C and D.
    </p>

    <button onclick="readPDF()">
      📖 Load PDF
    </button>

    <div id="pdfStatus"></div>

    <button onclick="goHome()">
      ⬅ Back
    </button>
  </div>

  <!-- QUIZ -->
  <div id="quiz" class="card hidden">

    <div id="questionNumber"></div>

    <h2 id="question"></h2>

    <div id="options"></div>

    <div id="feedback"></div>

    <button id="nextBtn" onclick="nextQuestion()" class="hidden">
      Next Question ➡
    </button>

  </div>

  <!-- RESULT -->
  <div id="result" class="card hidden">

    <h2>🎉 Quiz Completed!</h2>

    <div class="score" id="finalScore"></div>

    <button onclick="restartQuiz()">
      🔄 Try Again
    </button>

    <button onclick="goHome()">
      🏠 Home
    </button>

  </div>

</div>

    }
  ]
};

let currentQuestion = 0;
let score = 0;
let answered = false;

}

const questionBank = {

      ],

      explanation: "Pharmacology is the study of drugs and their effects."
    },

    {

      options: [
        "Absorption, Distribution, Metabolism, Excretion",
        "Administration, Drug, Medicine, Effect",
        "Absorption, Drug, Metabolism, Effect",
        "None of these"
      ],
      answer: 0,
      explanation: "ADME means Absorption, Distribution, Metabolism and Excretion."
    },

    {
      q: "Which organ is mainly responsible for drug metabolism?",
      options: [
        "Heart",
        "Liver",
        "Lung",
        "Skin"
      ],
      answer: 1,
      explanation: "The liver is the major site of drug metabolism."
    }
  ],

  microbiology: [
    {
      q: "Bacteria are generally:",
      options: [
        "Prokaryotic",
        "Eukaryotic",
        "Multicellular animals",
        "Viruses"
      ],
      answer: 0,
      explanation: "Bacteria are prokaryotic organisms."
    }
  ],

  pharmaceutics: [
    {
      q: "What is viscosity?",
      options: [
        "Resistance to flow",
        "Density of liquid",
        "Weight of liquid",
        "Temperature"
      ],
      answer: 0,
      explanation: "Viscosity is the resistance offered by a fluid to flow."
    }
  ]
};


let quizQuestions = [];
let currentQuestion = 0;
let score = 0;
let answered = false;


/* -------------------------
   PAGE NAVIGATION
-------------------------- */

function hideAll() {
  document.getElementById("home").classList.add("hidden");
  document.getElementById("generator").classList.add("hidden");
  document.getElementById("pdfSection").classList.add("hidden");
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("result").classList.add("hidden");
}

function goHome() {
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}

function showGenerator() {
  hideAll();
  document.getElementById("generator").classList.remove("hidden");
}

function showPDF() {
  hideAll();
  document.getElementById("pdfSection").classList.remove("hidden");
}


/* -------------------------
   GENERATE MCQs
-------------------------- */

function generateMCQs() {

  let topic = document
    .getElementById("topic")
    .value
    .toLowerCase()
    .trim();

  let questions = [];

  if (topic.includes("pharmacology")) {
    questions = questionBank.pharmacology;
  }
  else if (topic.includes("microbiology")) {
    questions = questionBank.microbiology;
  }
  else if (topic.includes("pharmaceutics")) {
    questions = questionBank.pharmaceutics;
  }
  else {
    questions = [
      {
        q: "Which of the following is important for effective learning?",
        options: [
          "Regular practice",
          "Never revising",
          "Skipping questions",
          "Not studying"
        ],
        answer: 0,
        explanation: "Regular practice improves learning and retention."
      }
    ];
  }

  quizQuestions = [...questions];
  startQuiz();
}


/* -------------------------
   START QUIZ
-------------------------- */

function startQuiz() {

  currentQuestion = 0;
  score = 0;

  hideAll();

  document.getElementById("quiz")
    .classList.remove("hidden");

  showQuestion();
}


/* -------------------------
   SHOW QUESTION
-------------------------- */

function showQuestion() {

  answered = false;

  let q = quizQuestions[currentQuestion];

  document.getElementById("questionNumber").innerText =
    "Question " + (currentQuestion + 1) +
    " / " + quizQuestions.length;

  document.getElementById("question").innerText = q.q;

  document.getElementById("feedback").innerText = "";

  document.getElementById("nextBtn")
    .classList.add("hidden");

  let optionsHTML = "";

  q.options.forEach((option, index) => {

    optionsHTML += `
      <button class="option"
      onclick="checkAnswer(${index})">
      ${String.fromCharCode(65 + index)}. ${option}
      </button>
    `;

  });

  document.getElementById("options").innerHTML = optionsHTML;
}


/* -------------------------
   CHECK ANSWER
-------------------------- */

function checkAnswer(selected) {

  if (answered) return;

  answered = true;

  let q = quizQuestions[currentQuestion];

  let buttons =
    document.querySelectorAll(".option");

  if (selected === q.answer) {

    score++;

    buttons[selected]
      .classList.add("correct");

    document.getElementById("feedback").innerText =
      "✅ Correct! " + q.explanation;

  } else {

    buttons[selected]
      .classList.add("wrong");

    buttons[q.answer]
      .classList.add("correct");

    document.getElementById("feedback").innerText =
      "❌ Wrong! Correct answer: " +
      q.options[q.answer] +
      ". " + q.explanation;
  }

  document.getElementById("nextBtn")
    .classList.remove("hidden");
}


/* -------------------------
   NEXT QUESTION
-------------------------- */

function nextQuestion() {

  currentQuestion++;

  if (currentQuestion >= quizQuestions.length) {
    showResult();
  } else {
    showQuestion();
  }
}


/* -------------------------
   RESULT
-------------------------- */

function showResult() {

  hideAll();

  document.getElementById("result")
    .classList.remove("hidden");

  document.getElementById("finalScore").innerText =
    "Your Score: " +
    score +
    " / " +
    quizQuestions.length;
}


/* -------------------------
   RESTART
-------------------------- */

function restartQuiz() {
  startQuiz();
}

   SIMPLE PDF TEXT READER
-------------------------- */

async function readPDF() {

  const file =
    document.getElementById("pdfFile").files[0];

  if (!file) {
    alert("Please select a PDF first.");
    return;
  }

  document.getElementById("pdfStatus").innerHTML =
    "<p>📖 PDF selected. PDF question extraction will require a PDF reader library.</p>" +
    "<p>You can use the Generate MCQs section for now.</p>";
}
